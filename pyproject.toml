[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bldg3d"
version = "0.1.0"
description = "Best-available 3D buildings for any area: current OpenStreetMap footprints and tags + Google Open Buildings 2.5D satellite heights; 3D views and shapefile/GeoPackage/KML downloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ravi Satyappa Dabbanavar", email = "ravisd@nittesoa.ac.in"},
  {name = "Rohini N", email = "rohini@nittesoa.ac.in"},
]
dependencies = ["numpy", "pandas", "geopandas>=0.14", "shapely>=2", "pyogrio", "scikit-learn",
                "matplotlib", "osmnx>=1.9", "earthengine-api", "pydeck>=0.8", "requests", "pillow"]

[project.optional-dependencies]
app = ["streamlit>=1.48", "streamlit-folium>=0.20", "folium>=0.16"]
dev = ["pytest"]

[project.scripts]
bldg3d = "bldg3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bldg3d = ["data/demo/*"]
